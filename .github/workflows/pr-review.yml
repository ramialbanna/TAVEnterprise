name: PR Review (Claude reviewer subagents)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    name: Parallel reviewer subagents (TAV layer-aware)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Anthropic's Claude Code Action runs the parallel reviewer pattern
      # described in .claude/commands/review.md.
      # Requires repo secret ANTHROPIC_API_KEY (from console.anthropic.com).
      # Switched from CLAUDE_CODE_OAUTH_TOKEN on 2026-11-26: the old OAuth token
      # had expired and every review failed with is_error:true.
      - name: Run /review via Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: dependabot[bot]
          prompt: |
            /review

            You are reviewing PR #${{ github.event.pull_request.number }} on TAV-VAIP.
            Read CLAUDE.md, docs/01-architecture/identity.md, docs/05-process/voice.md, and the relevant sections
            of docs/01-architecture/system-overview.md before reviewing.

            Partition reviewers by TAV layer per .claude/commands/review.md and post
            the aggregated review as a single PR comment. Treat any of the following
            as BLOCKERS (not nits):
              - Facebook adapter requiring VIN
              - Conflation of Raw / Normalized / Vehicle Candidate / Lead
              - Silent drops (no reason_code)
              - Service-role key, HMAC secret, Manheim creds, or Twilio creds in source
              - Stale-suppression regression
              - Missing required indexes from docs/01-architecture/system-overview.md §12
              - v_active_inbox losing its filter semantics
